# agent-kit/swift-ios: минимальный проект для XcodeGen. .xcodeproj в git не
# хранится, его пересобирает scripts/test. Нужна сборка под устройство —
# убери CODE_SIGNING_ALLOWED и задай DEVELOPMENT_TEAM.
name: {{Name}}
options:
  bundleIdPrefix: {{BundleIdPrefix}}
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  {{Name}}:
    type: application
    platform: iOS
    sources:
      - {{Name}}
    info:
      path: {{Name}}/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
